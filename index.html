<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Navigator — Interactive Demo</title>
<style>
  :root{
    --navy:#12313f;
    --teal:#1f6f78;
    --teal-light:#3f9aa3;
    --bg:#f4f6f7;
    --card:#ffffff;
    --ink:#1a2b2f;
    --ink-soft:#5a6b6e;
    --line:#e1e7e8;
    --accent:#ef8354;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  header{
    background:linear-gradient(135deg,var(--navy),var(--teal));
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  header .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:17px;
    letter-spacing:.2px;
  }
  header .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
  }
  header .meta{
    font-size:12.5px;
    opacity:.85;
    text-align:right;
    line-height:1.4;
  }
  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }
  nav.rail{
    width:250px;
    flex-shrink:0;
    background:var(--card);
    border-right:1px solid var(--line);
    padding:18px 10px;
    overflow-y:auto;
  }
  nav.rail h4{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    margin:18px 12px 8px;
  }
  nav.rail h4:first-child{margin-top:4px;}
  .rail-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border-radius:9px;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    line-height:1.3;
  }
  .rail-item .num{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--line);
    color:var(--ink-soft);
    font-size:11px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .rail-item:hover{background:#f0f4f4;}
  .rail-item.active{background:var(--teal);color:#fff;}
  .rail-item.active .num{background:rgba(255,255,255,.25);color:#fff;}
  .rail-item.divider-item{cursor:default;}

  main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    padding:26px 34px 18px;
    overflow:hidden;
  }
  .progressbar{
    height:5px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:20px;
    flex-shrink:0;
  }
  .progressbar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--accent));
    transition:width .35s ease;
  }
  .stage{
    flex:1;
    min-height:0;
    display:flex;
    gap:28px;
  }
  .panel-text{
    width:340px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .tag{
    display:inline-block;
    background:#e8f3f2;
    color:var(--teal);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:14px;
    width:fit-content;
  }
  .panel-text h1{
    font-size:26px;
    line-height:1.25;
    margin:0 0 14px;
    white-space:pre-line;
  }
  .panel-text p{
    font-size:15px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0;
  }
  .panel-img{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(18,49,63,.08);
    overflow:hidden;
    position:relative;
  }
  .panel-img img, .panel-img video{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center center;
    display:block;
  }
  .panel-img.empty{
    background:linear-gradient(135deg,#e8f3f2,#f4f6f7);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cover-wrap, .closing-wrap{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    max-width:640px;
  }
  .cover-wrap h1, .closing-wrap h1{
    font-size:38px;
    white-space:pre-line;
  }
  .cover-wrap p, .closing-wrap p{
    font-size:16.5px;
  }
  .footer-nav{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:10px 20px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .btn.primary{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }
  .btn:disabled{opacity:.35;cursor:default;}
  .step-count{
    font-size:13px;
    color:var(--ink-soft);
  }
  @media (max-width: 900px){
    nav.rail{display:none;}
    .stage{flex-direction:column;}
    .panel-text{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> Employee Navigator — Interactive Demo</div>
  <div class="meta">Sample demo account &middot; Colonial Demo (Employer)<br>For employer &amp; broker preview purposes</div>
</header>

<div class="layout">
  <nav class="rail" id="rail"></nav>
  <main>
    <div class="progressbar"><div class="progressbar-fill" id="progressFill"></div></div>
    <div class="stage" id="stage"></div>
    <div class="footer-nav">
      <button class="btn" id="prevBtn">&larr; Back</button>
      <span class="step-count" id="stepCount"></span>
      <button class="btn primary" id="nextBtn">Next &rarr;</button>
    </div>
  </main>
</div>

const railGroups = [
  {label: "Employer / HR Admin View", section: "admin"},
  {label: "Employee Enrollment Experience", section: ["employee-intro","employee"]},
];

let current = 0;

function sectionLabel(sec){
  if(sec === "cover") return "Welcome";
  if(sec === "closing") return "Wrap-up";
  if(sec === "admin") return "Employer / HR Admin View";
  if(sec === "employee-intro" || sec === "employee") return "Employee Enrollment Experience";
  if(sec === "hrtasks-intro" || sec === "hrtasks") return "HR Tasks in Action";
  return "";
}

function buildRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  let lastLabel = null;
  SLIDES.forEach((s, i) => {
    const label = sectionLabel(s.section);
    if(label !== lastLabel){
      const h = document.createElement("h4");
      h.textContent = label;
      rail.appendChild(h);
      lastLabel = label;
    }
    const item = document.createElement("div");
    item.className = "rail-item";
    item.dataset.idx = i;
    const numSpan = document.createElement("span");
    numSpan.className = "num";
    numSpan.textContent = (i+1);
    const textSpan = document.createElement("span");
    textSpan.textContent = s.tag || s.title.split("\n")[0];
    item.appendChild(numSpan);
    item.appendChild(textSpan);
    item.addEventListener("click", () => goTo(i));
    rail.appendChild(item);
  });
}

function render(){
  const s = SLIDES[current];
  const stage = document.getElementById("stage");
  stage.innerHTML = "";

  if(s.section === "cover" || s.section === "closing" || s.section === "employee-intro" || s.section === "hrtasks-intro"){
    const wrap = document.createElement("div");
    wrap.className = s.section === "closing" ? "closing-wrap" : (s.section === "cover" ? "cover-wrap" : "panel-text");
    if (s.section === "employee-intro" || s.section === "hrtasks-intro") wrap.style.maxWidth = "640px";
    const h1 = document.createElement("h1");
    h1.textContent = s.title;
    const p = document.createElement("p");
    p.textContent = s.body;
    wrap.appendChild(h1);
    wrap.appendChild(p);
    stage.appendChild(wrap);
  } else {
    const textPanel = document.createElement("div");
    textPanel.className = "panel-text";
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = s.tag;
    const h1 = document.createElement("h1");
    h1.textContent = s.title;
    const p = document.createElement("p");
    p.textContent = s.body;
    textPanel.appendChild(tag);
    textPanel.appendChild(h1);
    textPanel.appendChild(p);

    const imgPanel = document.createElement("div");
    imgPanel.className = "panel-img";
    if (s.video) {
      const video = document.createElement("video");
      video.src = s.video;
      video.autoplay = true;
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.controls = true;
      imgPanel.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.title;
      imgPanel.appendChild(img);
    }

    stage.appendChild(textPanel);
    stage.appendChild(imgPanel);
  }

  document.getElementById("progressFill").style.width = ((current+1)/SLIDES.length*100) + "%";
  document.getElementById("stepCount").textContent = "Step " + (current+1) + " of " + SLIDES.length;
  document.getElementById("prevBtn").disabled = current === 0;
  document.getElementById("nextBtn").textContent = current === SLIDES.length - 1 ? "Restart ↺" : "Next →";

  document.querySelectorAll(".rail-item").forEach(el => {
    el.classList.toggle("active", Number(el.dataset.idx) === current);
  });
  const activeEl = document.querySelector(".rail-item.active");
  if(activeEl) activeEl.scrollIntoView({block:"nearest"});
}

function goTo(i){
  current = Math.max(0, Math.min(SLIDES.length - 1, i));
  render();
}

document.getElementById("prevBtn").addEventListener("click", () => goTo(current - 1));
document.getElementById("nextBtn").addEventListener("click", () => {
  if(current === SLIDES.length - 1){ goTo(0); } else { goTo(current + 1); }
});
document.addEventListener("keydown", (e) => {
  if(e.key === "ArrowRight") goTo(current + 1);
  if(e.key === "ArrowLeft") goTo(current - 1);
});

buildRail();
render();
</script>
</body>
</html>
